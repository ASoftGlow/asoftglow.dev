    <style>

            src: url("/fonts/apollo7.woff2") format("woff2");
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            display: flex;

        }

        td div {
            font-family: apollo7;
            font-size: 64px;
            outline: 1px dotted;
            width: 0.5em;
        }

</head>
