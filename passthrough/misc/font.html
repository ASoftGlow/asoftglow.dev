<!DOCTYPE html>
<html lang="en">
<head>
    <title>Font Utility</title>
    <link rel="shortcut icon" href="/images/font/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        @font-face {
            font-family: apollo7;
            src: url("/fonts/apollo7.woff2") format("woff2");
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            margin: 8px;
            height: calc(100% - 16px);
        }

        textarea {
            border: none;
            outline: none;
            background: none;
            resize: none;
            height: 100%;
            font-size: 128px;
            font-family: apollo7;
        }

        th {
            text-align: left;
        }

        td div {
            font-family: apollo7;
            font-size: 64px;
            outline: 1px dotted;
            width: 0.5em;
        }
    </style>
</head>
<body>
    <details open>
      <summary>Keys Guide</summary>
      <table>
          <thead>
              <th>q</th><th>w</th><th>e</th><th>r</th><th>u</th><th>i</th><th>o</th><th>p</th>
          </thead>
          <tbody>
              <td><div>q</div></td><td><div>w</div></td><td><div>e</div></td><td><div>r</div></td><td><div>u</div></td><td><div>i</div></td><td><div>o</div></td><td><div>p</div></td>
          </tbody>
          <thead>
              <th>a</th><th>s</th><th>f</th><th>h</th><th>j</th><th>l</th><th>;</th>
          </thead>
          <tbody>
              <td><div>a</div></td><td><div>s</div></td><td><div>f</div></td><td><div>h</div></td><td><div>j</div></td><td><div>l</div></td><td><div>;</div></td>
          </tbody>
          <thead>
              <th>z</th><th>x</th><th>c</th><th>v</th><th>m</th><th>,</th><th>.</th><th>/</th>
          </thead>
          <tbody>
              <td><div>z</div></td><td><div>x</div></td><td><div>c</div></td><td><div>v</div></td><td><div>m</div></td><td><div>,</div></td><td><div>.</div></td><td><div>/</div></td>
          </tbody>
          <thead>
              <th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
          </thead>
          <tbody>
              <td><div>0</div></td><td><div>1</div></td><td><div>2</div></td><td><div>3</div></td><td><div>4</div></td><td><div>5</div></td><td><div>6</div></td>
          </tbody>
      </table>
    </details>
    <details>
      <summary>Guides</summary>
      <a href="/images/font/glyph_guide.jpg">Characters</a>
      <a href="/images/font/numbers.jpg">Numbers</a>
      <a href="/images/font/keys.jpg">Keys</a>
    </details>
    <textarea spellcheck="false"></textarea>
    <script>
      const ta = document.getElementsByTagName("textarea")[0];
      if (location.hash) ta.value = location.hash.slice(1);
      ta.addEventListener("input", e => location.hash = e.target.value);
    </script>
</body>
</html>
