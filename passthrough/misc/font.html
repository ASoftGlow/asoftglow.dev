<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <style>
        @font-face {
            font-family: apollo7;
            src: url("/fonts/apollo7.woff2") format("woff2");
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        textarea {
            border: none;
            outline: none;
            background: none;
            resize: none;
            height: 100%;
            font-size: 64px;
            font-family: apollo7;
        }

        th {
            text-align: left;
        }

        td {
            font-family: apollo7;
            font-size: 64px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th>a</th><th>b</th><th>c</th><th>d</th>
        </thead>
        <tbody>
            <td>a</td><td>b</td><td>c</td><td>d</td>
        </tbody>
    </table>
    <textarea spellcheck="false"></textarea>
</body>
</html>
